name: Update football data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data-publish
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch football and derived data
        run: npm run fetch:all

      - name: Rebuild offline snapshot
        if: always()
        run: npm run build:standalone

      - name: Commit data updates
        if: always()
        run: |
          if [[ -n "$(git status --porcelain data standalone.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data standalone.html
            git commit -m "Update football data"
            git push
          else
            echo "No data changes to commit."
          fi
