name: Update attendance data

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data-publish
  cancel-in-progress: false

jobs:
  update-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Test match attendance parser
        run: npm test

      - name: Fetch attendance data
        run: npm run fetch:attendance

      - name: Fetch attendance history
        if: always()
        run: npm run fetch:attendance-history

      - name: Fetch individual match attendance
        if: always()
        run: npm run fetch:match-attendance

      - name: Rebuild offline snapshot
        if: always()
        run: npm run build:standalone

      - name: Commit attendance updates
        if: always()
        run: |
          if [[ -n "$(git status --porcelain data/csl-attendance.json data/csl-attendance-history.json data/attendance-csl.json data/attendance-history-csl.json data/attendance-meta.json data/csl-match-attendance.json data/match-attendance-meta.json standalone.html)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/csl-attendance.json data/csl-attendance-history.json data/attendance-csl.json data/attendance-history-csl.json data/attendance-meta.json standalone.html
            git add --ignore-errors data/csl-match-attendance.json data/match-attendance-meta.json || true
            git commit -m "Update attendance data"
            git push
          else
            echo "No attendance data changes to commit."
          fi
