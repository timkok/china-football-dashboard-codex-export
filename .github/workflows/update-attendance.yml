name: Update attendance data

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-attendance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch attendance data
        run: npm run fetch:attendance

      - name: Commit attendance updates
        run: |
          if [[ -n "$(git status --porcelain data/attendance-csl.json data/attendance-meta.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/attendance-csl.json data/attendance-meta.json
            git commit -m "Update attendance data"
            git push
          else
            echo "No attendance data changes to commit."
          fi
